[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversion-bot"
version = "0.1.0"
description = "Production-hardened mean reversion engine with risk and execution helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "alpaca-py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
