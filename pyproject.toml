[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversion-bot"
version = "0.1.0"
description = "Production-hardened mean reversion engine with risk and execution helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "alpaca-py>=0.20",
  "alpaca-trade-api>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
